<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"

        crossorigin="anonymous"></script>
<!-- Start of template -->
<div class="container-fluid d-flex justify-content-center align-items-center min-vh-100 py-4">
    <div class="card p-4" style="width: 100%; max-width: 400px;">
        <div class="card-title text-center">
            <h4>Sign up</h4>
        </div>
        <div class="card-body">
            <form method="POST" action="/signup">
                <div class="mb-3">
                    <input id="username" name="username" type="text" class="form-control" value="{{username}}" placeholder="[Username]" aria-label="Username" required>
                </div>
                <div class="mb-3">
                    <input id="password1" name="password1" type="password" class="form-control" placeholder="Password" aria-label="Password" required>
                </div>
                <div class="mb-3">
                    <input id="password2" name="password2" type="password" class="form-control" placeholder="Re-enter Password" aria-label="Re-enter Password" required>
                </div>
                <div class="mb-3">
                    <button type="submit"  class="btn btn-outline-primary btn-sm rounded-4">Sign up</button>
                </div>
<!-- End of template -->
