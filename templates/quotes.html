<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quote</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
<!-- Start of template -->
<div class="container-fluid d-flex justify-content-center align-items-center min-vh-100 py-4">
    <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body p-2 border-5 border-dark">
            <div class="d-flex justify-content-between align-items-center">
                <figure>
                    <blockquote class="blockquote fs-1 fst-italic">
                        From the screen to the ring to the pen to the king
                    </blockquote>
                    <figcaption class="blockquote-footer">
                        KSI in <cite title="Source Title">Thick of it</cite>
                    </figcaption>
                </figure>
            </div>
        </div>
    </div>
</div>
<!-- End of template -->
</body>
</html>
