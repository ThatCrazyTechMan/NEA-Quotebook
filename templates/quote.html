<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quote</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
<!-- Start of template -->

<div class="container d-flex min-vh-100 flex-column py-4">
    <div class="row mt-5">
        <div class="col-2">
            <a href="http://localhost:8000/home" class="btn rounded-4 btn-primary">Home</a>
        </div>
        <div class="col-12">
            <p class="text-end">{{quote.date}}</p>
        </div>
    </div>
    <div class="p-5 rounded-4 shadow-lg ">
        <div class="row">
            <div class="col-12">
                <figure>

                    <blockquote class="blockquote fst-italic" style="font-size: 50pt">
                        "{{ quote.content }}"
                    </blockquote>
                </figure>
            </div>
        </div>
        <div class="row">
            <div class="col-6">
                <h4 class="fst-italic"> {{quote.context}} </h4>
            </div>
            <div class="col-6">
                <p class="text-end" style="font-size: 20pt">- {{quote.author}}</p>
            </div>
        </div>
        <div class="col-2 py-4">
            <form action="/delete" method="POST">
                <button type="submit" name="{{quote_id}}" id="{{quote_id}}" class="btn btn-outline-danger btn-sm rounded-4">Delete quote</button>
            </form>
        </div>
    </div>
    <div class="row mt-auto">
        <div class="col-12">
            <h3>From this author:</h3>
        </div>
    </div>
    <div class="row">
        {% for r in related %}
        <div class="col-4">
            <div class="card rounded-4">
                <div class="card-body">
                    {{ r.content }}
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
<!-- End of template -->
</body>
</html>
