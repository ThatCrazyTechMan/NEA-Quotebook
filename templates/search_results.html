<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
<!-- Start of template -->
<a href="http://localhost:8000/quote" class="btn btn-primary">Quote</a>
<a href="http://localhost:8000/" class="btn btn-primary">Index</a>
<a class="btn btn-primary" href="http://localhost:8000/login" role="button">Login</a>
<a class="btn btn-primary" href="http://localhost:8000/home" role="button">Home</a>

<div class="container py-4">
    <div class="container">
        <div class="col-5">
            <input type="text" class="form-control form-control-lg rounded-pill shadow-sm px-4"
                   placeholder="Search for tags, people or specific quotes"
                   aria-label="Search for tags, people or specific quotes">
        </div>
    </div>
    <div class="container py-4">
        <div class="p-5 rounded-4 shadow-lg">
            {% for i in range(4) %}
            <div class="row mt-4">
                <div class="col-6">
                    <div class="card rounded-4">
                        <div class="card-body">
                            <h5>Bludclaart Bludclaart Bludclaart</h5>
                        </div>
                        <div class="card-footer text-muted">
                            <div class="row">
                                <div class="col-4">
                                    <span class="badge rounded-pill text-bg-primary">Tag</span>
                                    <span class="badge rounded-pill text-bg-primary">Tag</span>
                                    <span class="badge rounded-pill text-bg-primary">Tag</span>
                                </div>
                                <div class="col-4">
                                    <p class="text-center">DD/MM/YYYY</p>
                                </div>
                                <div class="col-4">
                                    <p class="text-end">- KSI in <cite>Thick of it</cite></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-6">
                    <div class="card rounded-4">
                        <div class="card-body">
                            <h5>Bludclaart Bludclaart Bludclaart</h5>
                        </div>
                        <div class="card-footer text-muted">
                            <div class="row">
                                <div class="col-4">
                                    <span class="badge rounded-pill text-bg-primary">Tag</span>
                                    <span class="badge rounded-pill text-bg-primary">Tag</span>
                                    <span class="badge rounded-pill text-bg-primary">Tag</span>
                                </div>
                                <div class="col-4">
                                    <p class="text-center">DD/MM/YYYY</p>
                                </div>
                                <div class="col-4">
                                    <p class="text-end">- KSI in <cite>Thick of it</cite></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}

        </div>
    </div>
</div>
<!-- End of template -->
</body>
</html>
