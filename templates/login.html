<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
<!-- Start of template -->
<div class="btn-group">
    <a class="btn btn-primary" href="http://localhost:8000/" role="button">Index</a>
    <a class="btn btn-primary" href="http://localhost:8000/quote" role="button">Quote</a>
    <a class="btn btn-primary" href="http://localhost:8000/results" role="button">Search results</a>
</div>
<div class="container-fluid d-flex justify-content-center align-items-center min-vh-100 py-4">
    <div class="card p-4" style="width: 100%; max-width: 400px;">
        <div class="card-title text-center">
            <figure class="text-center">
                <blockquote class="blockquote">
                    <h3>"{{rand_quote.content}}"</h3>
                </blockquote>
                <figcaption class="blockquote-footer">
                    {{rand_quote.author}}
                </figcaption>
            </figure>
            <h4>Log in or Sign up</h4>
        </div>
        <div class="card-body">
            <form method="POST" action="/user">
                <div class="mb-3">
                    <input type="text" id="username" name="username" class="form-control" placeholder="Username" aria-label="Username">
                </div>
                <div class="mb-3">
                    <button type="submit" class="btn btn-primary btn-md rounded-4">Login or Sign up</button>
                </div>
            </form>
        </div>
    </div>
</div>
<!-- End of template -->
</body>
</html>
